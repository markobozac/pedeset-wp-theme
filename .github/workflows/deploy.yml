name: Deploy na A2 hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Mapa teme na serveru
  DEPLOY_PATH: /home/strkacom/public_html/markobozac/50godina/wp-content/themes/pedeset/

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP sintaksa
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH postavke
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ključ iz cPanela je obično zaštićen lozinkom: skini je (opcionalni secret SSH_KEY_PASSPHRASE)
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/deploy_key
          fi
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Privatni ključ nije valjan ili traži lozinku (dodaj secret SSH_KEY_PASSPHRASE)"; exit 1; }
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # Bez --delete: datoteke koje postoje samo na serveru
      # (assets/og-home.jpg, ikone) ostaju netaknute.
      - name: rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          rsync -rltvz --chmod=D755,F644 \
            --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='README.md' --exclude='LICENSE' --exclude='DEPLOY.md' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o IdentitiesOnly=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
